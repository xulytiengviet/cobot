name: Deploy Cobot Lab
on:
  push:
    branches: [main]
    paths: ['index.html', 'camera-check.html', 'web/**', 'tests/**', 'scripts/**', 'PAROL6_URDF/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Download verified AI assets
        run: python scripts/prepare-vision.py
      - name: Test camera and AI in Chromium
        env:
          COBOT_PLAYWRIGHT: /tmp/cobot-qa/node_modules/playwright
        run: |
          npm install --prefix /tmp/cobot-qa playwright@1.51.1
          /tmp/cobot-qa/node_modules/.bin/playwright install --with-deps chromium
          python -m http.server 8000 > /tmp/cobot-http.log 2>&1 &
          node tests/camera-browser.cjs
      - name: Keep verified AI assets with the source
        run: |
          git add web/vendor/mediapipe
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor verified MediaPipe runtime and model for Pages'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Stage web assets
        run: |
          mkdir -p _site/PAROL6_URDF/PAROL6
          cp index.html camera-check.html LICENSE WEB_SIMULATOR.md _site/
          cp -r web _site/
          cp -r PAROL6_URDF/PAROL6/urdf PAROL6_URDF/PAROL6/meshes _site/PAROL6_URDF/PAROL6/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
